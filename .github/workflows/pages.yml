name: Online demo

# Publishes the demo office (a static site, no server) to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # GitHub Pages needs a public repository (or a paid plan): a private one skips the demo instead of failing
    if: ${{ !github.event.repository.private }}
    name: Build the demo site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # a project site lives under /<repo>/; a <user>.github.io repository is served from the root
      - name: Build
        run: |
          if [[ "$REPO" == *.github.io ]]; then export OFFICE_BASE_PATH=""; else export OFFICE_BASE_PATH="/$REPO"; fi
          node scripts/build-demo.mjs
        env:
          REPO: ${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
